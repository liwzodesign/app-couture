<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion - Couturier Créatif</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <header>
    <h1>Connexion à Couturier Créatif</h1>
  </header>

  <main>
    <section id="user-display" aria-live="polite"></section>

    <section id="auth-forms">
      <form id="login-form" aria-label="Formulaire de connexion">
        <h2>Connexion</h2>
        <label for="login-email">Email</label>
        <input type="email" id="login-email" name="email" required />
        <label for="login-password">Mot de passe</label>
        <input type="password" id="login-password" name="password" required />
        <button type="submit">Se connecter</button>
      </form>

      <form id="signup-form" aria-label="Formulaire d'inscription">
        <h2>Inscription</h2>
        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" name="email" required />
        <label for="signup-password">Mot de passe</label>
        <input type="password" id="signup-password" name="password" required />
        <button type="submit">S'inscrire</button>
      </form>

      <button id="logout-btn" style="display:none;">Se déconnecter</button>
    </section>

  <nav class="main-nav">
    <button class="menu-toggle" aria-label="Toggle navigation menu">
      <span class="hamburger"></span>
    </button>
      <ul class="nav-links">
        <li><a href="/" class="active">Accueil</a></li>
        <li><a href="/categories/homme.html">Homme</a></li>
        <li><a href="/categories/femme.html">Femme</a></li>
        <li><a href="/categories/catalogue.html">Catalogue</a></li>
        <li><a href="/categories/panier.html">Panier</a></li>
        <li><a href="/categories/product-detail.html">Détail produit</a></li>
        <li><a href="/categories/avis.html">Avis</a></li>
        <li><a href="/sur-mesure.html">Sur-mesure</a></li>
        <li><a href="/contact.html">Contact</a></li>
        <li id="admin-link" style="display:none;"><a href="/admin.html">Admin</a></li>
      </ul>
  </nav>
</main>

  <script type="module" src="/js/firebase-auth.js"></script>
</body>
</html>
